<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAPI Docs Assistant</title>
<style>
:root{--bg:#f2f5f8;--panel:#fff;--text:#14181f;--muted:#5d6775;--line:#dde3ea;--accent:#00796b;--accent-ink:#fff;--user:#dff1ee;--code:#eef1f5;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--panel:#171d24;--text:#e8edf2;--muted:#93a0af;--line:#2a333d;--accent:#3ccdb8;--accent-ink:#06211d;--user:#14312d;--code:#222b35;--warn:#e0a84a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;font-weight:650}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{flex:1;overflow-y:auto;padding:22px 16px}
#chat{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hint{color:var(--muted);margin:0}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.examples button{font:inherit;font-size:13.5px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.examples button:hover{border-color:var(--accent)}
.msg{max-width:88%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--panel);border:1px solid var(--line)}
.msg.user{align-self:flex-end;background:var(--user);border-color:transparent;border-radius:14px 14px 4px 14px}
.msg p{margin:0 0 .7em}.msg p:last-child{margin-bottom:0}
.msg code{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
.msg pre{margin:.6em 0;padding:10px 12px;background:var(--code);border-radius:8px;overflow-x:auto}
.msg pre code{padding:0;background:none}
.cite{font:600 11px/1 system-ui;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:5px;padding:2px 5px;margin:0 2px;cursor:pointer;vertical-align:1px}
.cite:hover{background:var(--accent);color:var(--accent-ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.pill.route{color:var(--accent);border-color:var(--accent)}
.pill.off{color:var(--warn);border-color:var(--warn)}
details{margin-top:10px;font-size:13.5px}
summary{cursor:pointer;color:var(--muted)}
ol.src{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.src li{padding:6px 8px;border-radius:6px}
ol.src li.flash{background:var(--user)}
.file{font:12.5px ui-monospace,Consolas,monospace;color:var(--accent)}
.snip{display:block;color:var(--muted);white-space:pre-wrap;margin-top:2px}
.err{color:var(--warn)}
form{display:flex;gap:8px;max-width:740px;width:100%;margin:0 auto;padding:12px 16px 16px}
input{flex:1;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form button{font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:10px;padding:0 20px;cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>FastAPI Docs Assistant</h1>
  <p>Answers come only from the FastAPI documentation, with sources.</p>
</header>
<main><div id="chat">
  <p class="hint" id="hint">Ask about routing, validation, dependencies, security or deployment.</p>
  <div class="examples" id="examples"></div>
</div></main>
<form id="form">
  <input id="q" autocomplete="off" placeholder="Ask a question about FastAPI" aria-label="Question">
  <button id="send" type="submit">Ask</button>
</form>
<script>
const chat = document.getElementById('chat'), form = document.getElementById('form'),
      input = document.getElementById('q'), send = document.getElementById('send');
const EXAMPLES = ["How do I run code at startup and shutdown?", "What does response_model do?", "What's the capital of France?"];
const ROUTES = {retrieve: "from the docs", chitchat: "small talk", out_of_scope: "outside the docs"};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

EXAMPLES.forEach(t => {
  const b = el('button', '', t); b.type = 'button';
  b.onclick = () => ask(t);
  document.getElementById('examples').append(b);
});

function openSource(details, n) {
  details.open = true;
  const li = details.querySelectorAll('li')[n - 1];
  if (!li) return;
  li.classList.add('flash');
  li.scrollIntoView({block: 'nearest'});
  setTimeout(() => li.classList.remove('flash'), 1400);
}

function inline(parent, text, details) {
  const re = /(`[^`\n]+`|\[\d+\])/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    const tok = m[0];
    if (tok[0] === '`') { parent.append(el('code', '', tok.slice(1, -1))); }
    else {
      const n = +tok.slice(1, -1), b = el('button', 'cite', String(n));
      b.type = 'button'; b.title = 'Show source ' + n;
      b.onclick = () => openSource(details, n);
      parent.append(b);
    }
    last = re.lastIndex;
  }
  if (last < text.length) parent.append(text.slice(last));
}

function renderText(box, text, details) {
  text.split(/```[\w+-]*\n?/).forEach((part, i) => {
    if (i % 2) { const pre = el('pre'); pre.append(el('code', '', part.replace(/\n$/, ''))); box.append(pre); }
    else part.split(/\n{2,}/).forEach(par => {
      if (!par.trim()) return;
      const p = el('p'); inline(p, par.trim(), details); box.append(p);
    });
  });
}

function sourcesEl(sources) {
  const d = el('details');
  d.append(el('summary', '', `Sources (${sources.length})`));
  const ol = el('ol', 'src');
  sources.forEach(s => {
    const li = el('li');
    li.append(el('span', 'file', s.source.replace(/\\/g, '/')));
    li.append(el('span', 'snip', s.text.length > 320 ? s.text.slice(0, 320) + '…' : s.text));
    ol.append(li);
  });
  d.append(ol);
  return d;
}

function metaEl(data) {
  const m = el('div', 'meta');
  const r = el('span', 'pill route' + (data.route === 'out_of_scope' ? ' off' : ''), ROUTES[data.route] || data.route);
  m.append(r);
  Object.entries(data.latency_ms || {}).forEach(([k, v]) => m.append(el('span', 'pill', `${k} ${Math.round(v)} ms`)));
  return m;
}

async function ask(question) {
  question = question.trim();
  if (!question || send.disabled) return;
  document.getElementById('hint')?.remove();
  document.getElementById('examples')?.remove();
  chat.append(el('div', 'msg user', question));
  const bot = el('div', 'msg', 'Searching the docs…');
  chat.append(bot);
  bot.scrollIntoView({block: 'end'});
  input.value = ''; send.disabled = true;
  try {
    const res = await fetch('/query', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, mode: 'hybrid_rerank', top_k: 5})
    });
    const data = await res.json();
    bot.textContent = '';
    if (!res.ok) {
      bot.append(el('p', 'err', typeof data.detail === 'string' ? data.detail : 'The request was rejected. Check the question and try again.'));
      return;
    }
    const details = data.sources.length ? sourcesEl(data.sources) : null;
    renderText(bot, data.answer, details || el('details'));
    bot.append(metaEl(data));
    if (details) bot.append(details);
  } catch (e) {
    bot.textContent = '';
    bot.append(el('p', 'err', 'Could not reach the server. Check that the API is running, then try again.'));
  } finally {
    send.disabled = false; input.focus();
    bot.scrollIntoView({block: 'end'});
  }
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
</script>
</body>
</html>
